<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Clon en directo · edrian.exe</title>
<style>
  :root { --fondo: #07080c; --texto: #f2f4f8; --suave: #8b93a7; --acento: #00e0b8; --ambar: #ffb547; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; background: var(--fondo); color: var(--texto); font-family: "Segoe UI", system-ui, -apple-system, sans-serif; overflow: hidden; }
  body::before { content: ""; position: fixed; inset: 0; background: radial-gradient(ellipse at 50% 30%, #12203a 0%, transparent 60%), radial-gradient(ellipse at 80% 90%, #0b2a26 0%, transparent 55%); z-index: -1; }
  .pantalla { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3.2vh; padding: 4vh 4vw; text-align: center; }
  .marca { font-size: 2.2vh; letter-spacing: .35em; text-transform: uppercase; color: var(--suave); }
  .titulo { font-size: 7vh; font-weight: 800; line-height: 1.05; max-width: 80vw; }
  .tema { font-size: 4.2vh; font-weight: 600; color: var(--acento); max-width: 80vw; }
  .clave { font-size: 2.6vh; color: var(--ambar); letter-spacing: .08em; }
  .reloj { font-variant-numeric: tabular-nums; font-size: 9vh; font-weight: 800; }
  .estado { font-size: 2.6vh; color: var(--suave); }
  .puntos::after { content: ""; animation: puntos 1.4s steps(4, end) infinite; }
  @keyframes puntos { 0% { content: ""; } 25% { content: "."; } 50% { content: ".."; } 75% { content: "..."; } }
  .anillo { width: 12vh; height: 12vh; border-radius: 50%; border: .9vh solid #1d2433; border-top-color: var(--acento); animation: gira 1.1s linear infinite; }
  @keyframes gira { to { transform: rotate(360deg); } }
  #vista { display: none; }
  #vista video { height: 92vh; max-width: 92vw; border-radius: 1.6vh; box-shadow: 0 0 0 1px #1d2433, 0 3vh 8vh #000a; background: #000; }
  #play { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; background: #07080cb3; cursor: pointer; border: 0; color: var(--texto); }
  #play span { display: flex; align-items: center; gap: 2vh; font-size: 5vh; font-weight: 800; padding: 3vh 6vh; border-radius: 10vh; background: var(--acento); color: #04110e; }
  .oculto { display: none !important; }
</style>
</head>
<body>
  <section class="pantalla" id="espera">
    <div class="marca">edrian.exe · el clon en directo</div>
    <div class="titulo">Esperando un tema<span class="puntos"></span></div>
  </section>

  <section class="pantalla oculto" id="generando">
    <div class="marca">edrian.exe · el clon en directo</div>
    <div class="tema" id="g-tema"></div>
    <div class="clave" id="g-clave"></div>
    <div class="anillo"></div>
    <div class="reloj" id="g-reloj">00:00</div>
    <div class="estado">Generando el vídeo<span class="puntos"></span></div>
  </section>

  <section class="pantalla" id="vista">
    <video id="video" playsinline preload="auto" controls></video>
  </section>
  <button id="play" aria-label="Ver el vídeo"><span>▶ Ver el vídeo</span></button>

<script>
  const $ = (id) => document.getElementById(id);
  let actual = null, inicio = null, relojId = null;

  function mostrar(id) {
    for (const s of ["espera", "generando", "vista"]) $(s).classList.toggle("oculto", s !== id);
    $("vista").style.display = id === "vista" ? "flex" : "none";
  }
  function reloj() {
    if (!inicio) return;
    const s = Math.max(0, Math.floor((Date.now() - inicio) / 1000));
    $("g-reloj").textContent = String(Math.floor(s / 60)).padStart(2, "0") + ":" + String(s % 60).padStart(2, "0");
  }
  async function consultar() {
    try {
      const r = await fetch("latest.json?t=" + Date.now(), { cache: "no-store" });
      if (!r.ok) return;
      const d = await r.json();
      const firma = d.estado + "|" + (d.id || "") + "|" + (d.video || "");
      if (firma === actual) return;
      actual = firma;
      if (d.estado === "generando") {
        $("g-tema").textContent = d.tema || "";
        $("g-clave").textContent = d.clave ? "palabra clave: " + d.clave : "";
        inicio = d.inicio ? Date.parse(d.inicio) : Date.now();
        clearInterval(relojId); relojId = setInterval(reloj, 250); reloj();
        $("play").style.display = "none";
        mostrar("generando");
      } else if (d.estado === "listo" && d.video) {
        clearInterval(relojId);
        const v = $("video");
        v.src = d.video + "?v=" + encodeURIComponent(d.id || Date.now());
        mostrar("vista");
        $("play").style.display = "flex";
      } else {
        clearInterval(relojId);
        $("play").style.display = "none";
        mostrar("espera");
      }
    } catch (e) { /* sin red: se reintenta */ }
  }
  $("play").addEventListener("click", async () => {
    $("play").style.display = "none";
    const v = $("video");
    try { await document.documentElement.requestFullscreen(); } catch (e) {}
    v.currentTime = 0; v.muted = false;
    try { await v.play(); } catch (e) { v.controls = true; }
  });
  consultar();
  setInterval(consultar, 4000);
</script>
</body>
</html>
